<div class="card">
    <div class="card__emoji">{%IMAGE%}</div>
    <div class="card__title-box">
        <h2 class="card__heading">{%NAME%}</h2>
    </div>
    <div class="card__details">
        <div class="card__detail-box">
            <h6 class="card__detail card__detail--price">Starting at <span class="card__detail--value">₱{%PRICE%}</span>
            </h6>
        </div>
        <div class="card__detail-box">
            <h6 class="card__detail card__detail--location">📍 {%LOCATION%}</h6>
        </div>
    </div>
    <a class="card__link" href="/item?id={%ID%}">Details <span>&rarr;</span></a>
</div>
